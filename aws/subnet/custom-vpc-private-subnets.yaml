        - Key: 'Region'
          Value: 'Singapore'
        - Key: 'Environment'
          Value: 'Non Production'
      VpcId: !Ref customSGVPC
  privateSubnet2RTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: 
        !Ref privateSubnet2
      RouteTableId: 
        !Ref routeTableForPrivateSubnet2

  privateSubnet3:
